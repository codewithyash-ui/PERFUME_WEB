<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Noir Essence</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div id="loading-screen"><div class="loader"></div><p>Admin Portal...</p></div>
<div id="toast-msg" class="toast-notify"></div>

<nav class="navbar">
    <div class="container nav-container">
        <div class="logo"><i class="fas fa-crown"></i> NOIR ESSENCE</div>
        <div class="mobile-menu-btn"><i class="fas fa-bars"></i></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="admin-login.html" class="active"><i class="fas fa-user-shield"></i> Admin</a></li>
        </ul>
        <div class="nav-icons">
            <i class="far fa-heart" onclick="window.location.href='shop.html'"></i>
            <div class="cart-icon-wrapper" onclick="window.location.href='cart.html'">
                <i class="fas fa-shopping-bag"></i>
                <span id="cart-count" class="cart-count">0</span>
            </div>
        </div>
    </div>
</nav>

<div class="auth-container">
    <div class="glass-card auth-card">
        <i class="fas fa-user-shield" style="font-size: 3rem; color: var(--gold); margin-bottom: 1rem;"></i>
        <h2>Admin Login</h2>
        <p>Enter administrator credentials</p>
        <form id="admin-login-form">
            <input type="text" placeholder="Username" id="admin-username" required>
            <input type="password" placeholder="Password" id="admin-password" required>
            <button type="submit" class="btn-gold" style="width: 100%;">Login as Admin</button>
        </form>
        <p style="margin-top: 1rem; font-size: 0.8rem; opacity: 0.7;">Demo: yash@123 / admin@123</p>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    document.getElementById('admin-login-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = document.getElementById('admin-username').value;
        const password = document.getElementById('admin-password').value;
        
        // UPDATED CREDENTIALS
        if (username === 'yash@123' && password === 'admin@123') {
            localStorage.setItem('adminLoggedIn', 'true');
            localStorage.setItem('adminUsername', username);
            showToast('Welcome Admin Yash! ✨');
            setTimeout(() => {
                window.location.href = 'admin-dashboard.html';
            }, 1000);
        } else {
            showToast('Invalid credentials! Use yash@123 / admin@123', true);
        }
    });
</script>
</body>
</html>
