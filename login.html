<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Noir Essence</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div id="loading-screen"><div class="loader"></div><p>Welcome Back...</p></div>
<div id="toast-msg" class="toast-notify"></div>

<nav class="navbar">
    <div class="container nav-container">
        <div class="logo"><i class="fas fa-crown"></i> NOIR ESSENCE</div>
        <div class="mobile-menu-btn"><i class="fas fa-bars"></i></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html" class="active">Login</a></li>
            <li><a href="admin-login.html"><i class="fas fa-user-shield"></i> Admin</a></li>
        </ul>
        <div class="nav-icons">
            <i class="far fa-heart" onclick="window.location.href='shop.html'"></i>
            <div class="cart-icon-wrapper" onclick="window.location.href='cart.html'">
                <i class="fas fa-shopping-bag"></i>
                <span id="cart-count" class="cart-count">0</span>
            </div>
        </div>
    </div>
</nav>

<div class="auth-container">
    <div class="glass-card auth-card">
        <i class="fas fa-crown" style="font-size: 3rem; color: var(--gold); margin-bottom: 1rem;"></i>
        <h2>Welcome Back</h2>
        <p>Sign in to your account</p>
        <form id="login-form">
            <input type="email" placeholder="Email Address" id="login-email" required>
            <input type="password" placeholder="Password" id="login-password" required>
            <button type="submit" class="btn-gold" style="width: 100%;">Sign In</button>
        </form>
        <div class="auth-links">
            <a href="#">Forgot Password?</a>
            <a href="register.html">Create Account →</a>
        </div>
    </div>
</div>

<footer style="margin-top: 0;">
    <div class="container">
        <div class="footer-bottom"><p>© 2025 Noir Essence - All Rights Reserved</p></div>
    </div>
</footer>

<script src="js/main.js"></script>
<script src="js/cart.js"></script>
<script>
    document.getElementById('login-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        if (email) {
            localStorage.setItem('loggedInUser', email);
            showToast(`Welcome back! ✨`);
            setTimeout(() => window.location.href = 'index.html', 1000);
        }
    });
</script>
</body>
</html>
